<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%">
  <defs>
    <linearGradient id="code-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="border-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="highlight-glow" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left: Code Editor Card (560px wide) -->
  <g transform="translate(0, 0)">
    <!-- Window Container -->
    <rect x="2" y="2" width="556" height="394" rx="16" fill="url(#code-bg)" stroke="url(#border-subtle)" stroke-width="1.5" />
    
    <!-- Window Title Bar -->
    <rect x="2" y="2" width="556" height="36" rx="16" fill="#0f172a" />
    <rect x="2" y="22" width="556" height="16" fill="#0f172a" />
    <line x1="2" y1="38" x2="558" y2="38" stroke="#1e293b" stroke-width="1" />
    
    <!-- Mac Window Buttons -->
    <circle cx="20" cy="20" r="5.5" fill="#ef4444" />
    <circle cx="38" cy="20" r="5.5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5.5" fill="#10b981" />
    <text x="280" y="24" font-family="'Fira Code', monospace, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">sowmya.js</text>

    <!-- Code Content -->
    <g transform="translate(18, 62)" font-family="'Fira Code', 'Consolas', monospace" font-size="12.5" line-height="22">
      <!-- Line Numbers -->
      <g fill="#475569" text-anchor="end">
        <text x="18" y="0">1</text>
        <text x="18" y="22">2</text>
        <text x="18" y="44">3</text>
        <text x="18" y="66">4</text>
        <text x="18" y="88">5</text>
        <text x="18" y="110">6</text>
        <text x="18" y="132">7</text>
        <text x="18" y="154">8</text>
        <text x="18" y="176">9</text>
        <text x="18" y="198">10</text>
        <text x="18" y="220">11</text>
        <text x="18" y="242">12</text>
        <text x="18" y="264">13</text>
        <text x="18" y="286">14</text>
        <text x="18" y="308">15</text>
      </g>

      <!-- Code Text with Syntax Highlighting -->
      <g transform="translate(32, 0)">
        <!-- Line 1 -->
        <text x="0" y="0">
          <tspan fill="#c084fc">const</tspan> <tspan fill="#60a5fa">sowmya</tspan> <tspan fill="#e2e8f0">=</tspan> <tspan fill="#facc15">{</tspan>
        </text>
        <!-- Line 2 -->
        <text x="16" y="22">
          <tspan fill="#93c5fd">role</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#86efac">"Full Stack Developer"</tspan><tspan fill="#e2e8f0">,</tspan>
        </text>
        <!-- Line 3 -->
        <text x="16" y="44">
          <tspan fill="#93c5fd">location</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#86efac">"India 🇮🇳"</tspan><tspan fill="#e2e8f0">,</tspan>
        </text>
        <!-- Line 4 -->
        <text x="16" y="66">
          <tspan fill="#93c5fd">currentlyBuilding</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#facc15">[</tspan>
        </text>
        <!-- Line 5 -->
        <text x="32" y="88">
          <tspan fill="#86efac">"Spring Boot Applications"</tspan><tspan fill="#e2e8f0">,</tspan>
        </text>
        <!-- Line 6 -->
        <text x="32" y="110">
          <tspan fill="#86efac">"Cloud &amp; DevOps Projects"</tspan>
        </text>
        <!-- Line 7 -->
        <text x="16" y="132">
          <tspan fill="#facc15">]</tspan><tspan fill="#e2e8f0">,</tspan>
        </text>
        <!-- Line 8 -->
        <text x="16" y="154">
          <tspan fill="#93c5fd">learning</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#facc15">[</tspan>
        </text>
        <!-- Line 9 -->
        <text x="32" y="176">
          <tspan fill="#86efac">"Java &amp; Spring Boot"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"DSA"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"AWS"</tspan><tspan fill="#e2e8f0">,</tspan>
        </text>
        <!-- Line 10 -->
        <text x="32" y="198">
          <tspan fill="#86efac">"Docker &amp; Kubernetes"</tspan>
        </text>
        <!-- Line 11 -->
        <text x="16" y="220">
          <tspan fill="#facc15">]</tspan><tspan fill="#e2e8f0">,</tspan>
        </text>
        <!-- Line 12 -->
        <text x="16" y="242">
          <tspan fill="#93c5fd">interests</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#facc15">[</tspan><tspan fill="#86efac">"Problem Solving"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"Projects"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"Music"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"Anime"</tspan><tspan fill="#facc15">]</tspan><tspan fill="#e2e8f0">,</tspan>
        </text>
        <!-- Line 13 -->
        <text x="16" y="264">
          <tspan fill="#93c5fd">motto</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#86efac">"Keep Learning, Keep Growing 🚀"</tspan>
        </text>
        <!-- Line 14 -->
        <text x="0" y="286">
          <tspan fill="#facc15">}</tspan><tspan fill="#e2e8f0">;</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Right: Highlights Profile Section (360px wide) -->
  <g transform="translate(580, 0)">
    <!-- Item 1: Education -->
    <g transform="translate(0, 20)">
      <!-- Icon: Graduation cap in circle -->
      <circle cx="24" cy="24" r="22" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="24" y="30" font-size="18" text-anchor="middle">🎓</text>
      <g transform="translate(60, 16)">
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">BCA Student</text>
        <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">From Hyderabad, India 📍</text>
      </g>
    </g>

    <!-- Item 2: Passion -->
    <g transform="translate(0, 110)">
      <circle cx="24" cy="24" r="22" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="24" y="30" font-size="18" text-anchor="middle">🎯</text>
      <g transform="translate(60, 14)">
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Passionate about</text>
        <text x="0" y="23" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">Full Stack Development, DevOps,</text>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">DSA &amp; Cloud Technologies</text>
      </g>
    </g>

    <!-- Item 3: Love -->
    <g transform="translate(0, 205)">
      <circle cx="24" cy="24" r="22" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="24" y="30" font-size="18" text-anchor="middle">💜</text>
      <g transform="translate(60, 14)">
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">I love</text>
        <text x="0" y="23" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">Solving problems, building projects,</text>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">listening to music and exploring tech.</text>
      </g>
    </g>

    <!-- Item 4: Currently Focusing On -->
    <g transform="translate(0, 300)">
      <circle cx="24" cy="24" r="22" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="24" y="30" font-size="18" text-anchor="middle">🌱</text>
      <g transform="translate(60, 14)">
        <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Currently Focusing On</text>
        <text x="0" y="23" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">Java, Spring Boot, React, AWS,</text>
        <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">Docker, Kubernetes &amp; DSA</text>
      </g>
    </g>
  </g>
</svg>